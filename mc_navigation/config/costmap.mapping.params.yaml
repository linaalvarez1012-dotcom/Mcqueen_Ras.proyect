
controller_node:
  ros__parameters:
    use_sim_time: true
    controller_types: [dummy]
    dummy:
      rt_freq: 30.0
      plugin: easynav_controller/DummyController
      cycle_time_nort: 0.01
      cycle_time_rt: 0.001

localizer_node:
  ros__parameters:
    use_sim_time: true
    localizer_types: [mhamcl]
    mhamcl:
      rt_freq: 50.0
      freq: 10.0
      plugin: easynav_mhamcl_localizer/MHAMCLLocalizer
      initial_pose: {x: 0.5, y: 0.0, yaw: 0.0, std_dev_xy: 0.1, std_dev_yaw: 0.01}
      max_particles: 200
      min_particles: 30
      noise_translation: 0.05
      noise_rotation: 0.1
      noise_translation_to_rotation: 0.1
      distance_perception_error: 0.05
      reseed_freq: 0.33
      multihypothesis: true
      max_hypotheses: 5
      hypotheses_freq: 0.33
      min_candidate_weight: 0.5
      good_hypo_threshold: 0.6

maps_manager_node:
  ros__parameters:
    use_sim_time: true
    map_types: [navmap]
    navmap:
      freq: 10.0
      plugin: easynav_navmap_maps_manager/NavMapMapsManager

planner_node:
  ros__parameters:
    use_sim_time: true
    planner_types: [dummy]
    dummy:
      freq: 1.0
      plugin: easynav_planner/DummyPlanner
      cycle_time_nort: 0.2
      cycle_time_rt: 0.001

sensors_node:
  ros__parameters:
    use_sim_time: true
    forget_time: 0.5
    sensors: [laser1]
    perception_default_frame: odom
    laser1:
      topic: /scan
      type: sensor_msgs/msg/LaserScan

system_node:
  ros__parameters:
    use_sim_time: true
    position_tolerance: 0.1
    angle_tolerance: 0.05
